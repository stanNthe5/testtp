name: Publish to npm when version changes

on:
  push:
    branches:
      - main
      - master
    paths:
      - "package.json" # 仅当 package.json 被修改时触发

permissions:
  id-token: write # ✅ Required for npm Trusted Publisher (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 安装 Node 24 并使用 npm 官方 registry
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # 3️⃣ 获取当前包版本号
      - name: Get current package version
        id: pkg
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT

      # 4️⃣ 检查该版本是否已经发布
      - name: Check if version already exists on npm
        id: check
        run: |
          PKG_NAME=$(node -p 'require("./package.json").name')
          PUBLISHED=$(npm view $PKG_NAME versions --json | grep -o "\"${{ steps.pkg.outputs.version }}\"" || true)
          if [ -n "$PUBLISHED" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.pkg.outputs.version }} already exists on npm. Skipping publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 5️⃣ 安装依赖（如果你需要构建，可以在此阶段执行）
      - name: Install dependencies
        run: npm install

      # 6️⃣ 构建（可选）
      - name: Build source
        run: npm run build || echo "No build script defined."

      # 7️⃣ 发布到 npm（仅当版本未发布）
      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "Publishing version ${{ steps.pkg.outputs.version }}..."
          npm publish --access public
